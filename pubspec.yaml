name: pulse
description: A daily challenge app built around small real-life actions.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.4.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  shared_preferences: ^2.5.3
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rive/splash/
    - assets/rive/onboarding/
    - assets/rive/auth/
    - assets/rive/challenge/
    - assets/rive/progression/
    - assets/rive/achievements/
    - assets/rive/profile/
    - assets/rive/navigation/
