name: One-time task UI callback repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix(tasks): repair UI callback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair callback signature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/projects/presentation/projects_screen.dart')
          s = p.read_text()
          old = 'Future<void> _openTaskEditor({Task? task, String? milestoneId}) async {'
          new = 'Future<void> _openTaskEditor([Task? task, String? milestoneId]) async {'
          if old not in s:
              raise SystemExit('expected callback signature not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/projects/presentation/projects_screen.dart
          git commit -m "fix(tasks): repair UI callback"
          git push
# trigger after workflow creation
