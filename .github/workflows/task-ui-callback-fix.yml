name: Task UI callback fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(tasks): repair task editor callback wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical callback fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/projects/presentation/projects_screen.dart')
          s = p.read_text()
          old = 'Future<void> _openTaskEditor({Task? task, String? milestoneId}) async {'
          new = 'Future<void> _openTaskEditor([Task? task, String? milestoneId]) async {'
          if old not in s:
              raise SystemExit('expected callback signature not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/projects/presentation/projects_screen.dart
          git commit -m 'fix(tasks): repair task editor callback wiring'
          git push
