name: Flutter CI + Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter verification and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Generate Android project scaffolding
        run: flutter create . --platforms=android --project-name pulse --org com.pulse

      - name: Configure Android build toolchain
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('settings.gradle.kts')
          text = path.read_text()
          pattern = r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+("\s+apply\s+false)'
          updated, count = re.subn(pattern, r'\g<1>2.3.0\g<2>', text)
          if count != 1:
              raise SystemExit(f'Expected exactly one Kotlin plugin declaration, found {count}')
          path.write_text(updated)
          PY
          grep -n 'org.jetbrains.kotlin.android' settings.gradle.kts

      - name: Configure generated Kotlin compiler options
        working-directory: android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('build.gradle.kts')
          text = path.read_text()
          pattern = r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\)\s*\}'
          updated, count = re.subn(pattern, '', text)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy kotlinOptions.jvmTarget block, found {count}')
          updated += '\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)\n    }\n}\n'
          path.write_text(updated)
          PY
          grep -n -A4 -B1 'compilerOptions' build.gradle.kts

      - name: Configure Android SDK versions
        working-directory: android/app
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' build.gradle.kts
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' build.gradle.kts
          grep -E 'compileSdk|ndkVersion|minSdk|targetSdk' build.gradle.kts

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  functions:
    name: Firebase Functions tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Functions dependencies
        run: npm install

      - name: Run Functions tests
        run: npm test
