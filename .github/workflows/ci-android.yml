name: Flutter CI + Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter verification and Android APK/AAB
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.PULSE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Generate Android project scaffolding
        run: flutter create . --platforms=android --project-name pulse --org com.pulse

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Restore Firebase Android config
        working-directory: android/app
        run: echo "${{ secrets.PULSE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Register Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          anchor = r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false)'
          replacement = r'\g<1>\n    id("com.google.gms.google-services") version "4.5.0" apply false'
          updated, count = re.subn(anchor, replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one Kotlin plugin declaration in settings.gradle.kts, found {count}')
          settings.write_text(updated)

          app_build = Path('android/app/build.gradle.kts')
          text = app_build.read_text()
          anchor = r'(id\("dev\.flutter\.flutter-gradle-plugin"\))'
          replacement = r'\g<1>\n    id("com.google.gms.google-services")'
          updated, count = re.subn(anchor, replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one flutter-gradle-plugin declaration in app/build.gradle.kts, found {count}')
          app_build.write_text(updated)
          PY

      - name: Configure Android build toolchain
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('settings.gradle.kts')
          text = path.read_text()
          pattern = r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+("\s+apply\s+false)'
          updated, count = re.subn(pattern, r'\g<1>2.3.0\g<2>', text)
          if count != 1:
              raise SystemExit(f'Expected exactly one Kotlin plugin declaration, found {count}')
          path.write_text(updated)
          PY

      - name: Configure generated Kotlin compiler options
        working-directory: android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('build.gradle.kts')
          text = path.read_text()
          pattern = r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\)\s*\}'
          updated, count = re.subn(pattern, '', text)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy kotlinOptions.jvmTarget block, found {count}')
          updated += '\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)\n    }\n}\n'
          path.write_text(updated)
          PY

      - name: Configure Android SDK versions
        working-directory: android/app
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' build.gradle.kts
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' build.gradle.kts

      - name: Restore release signing keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          PULSE_KEYSTORE_BASE64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          printf '%s' "$PULSE_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/pulse-release.jks
          test -s android/app/keystore/pulse-release.jks

      - name: Configure release signing
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: android/app
        env:
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle.kts')
          text = path.read_text()
          marker = 'android {'
          signing = '''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file("keystore/pulse-release.jks")\n            storePassword = System.getenv("PULSE_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("PULSE_KEY_ALIAS")\n            keyPassword = System.getenv("PULSE_KEY_PASSWORD")\n        }\n    }'''
          if marker not in text:
              raise SystemExit('android block not found')
          text = text.replace(marker, signing, 1)
          release_marker = '    buildTypes {\n        release {\n'
          replacement = '    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")\n'
          if release_marker not in text:
              raise SystemExit('release buildTypes block not found')
          text = text.replace(release_marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify Play Store AAB
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Verify release signing
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under Android SDK build-tools" >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  functions:
    name: Firebase Functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Functions dependencies
        run: npm install
      - name: Run Functions tests
        run: npm test
