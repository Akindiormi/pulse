name: Deploy Supabase backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
    branches:
      - main

jobs:
  deploy:
    name: Deploy Supabase schema and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PULSE_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.PULSE_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PULSE_SUPABASE_DB_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.PULSE_SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Validate Supabase deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_SECRET_KEY"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy daily challenge function
        run: supabase functions deploy get-or-assign-daily-challenge --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy challenge completion function
        run: supabase functions deploy complete-challenge --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy account deletion function
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Set server secret
        run: supabase secrets set SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY"
