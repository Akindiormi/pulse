name: Temporary task handler repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'remove unused task handlers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove unused task handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/projects/presentation/projects_screen.dart')
          s = p.read_text()
          def remove_method(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'not found: {signature}')
              brace = text.find('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None: raise SystemExit('unterminated method')
              while end < len(text) and text[end] in '\n\r': end += 1
              return text[:start] + text[end:]
          s = remove_method(s, '  Future<void> _toggleTask(Task task) async {')
          s = remove_method(s, '  Future<void> _deleteTask(Task task) async {')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/projects/presentation/projects_screen.dart
          git commit -m "fix(tasks): remove unused task handlers"
          git push
